[package]
name = "rexs-parquets"
version = "0.1.0"
description = "Rex's Parquets — Trino SQL client for Parquet/Iceberg"
authors = []
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "parquet_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri               = { version = "2.11.2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
serde               = { version = "1.0", features = ["derive"] }
serde_json          = "1.0"
tokio               = { version = "1", features = ["full"] }
reqwest             = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
rusqlite            = { version = "0.32", features = ["bundled"] }
thiserror           = "1"
dirs                = "5"
uuid                = { version = "1", features = ["v4"] }
chrono              = { version = "0.4", features = ["serde"] }
parquet             = { version = "53", default-features = false, features = ["snap", "brotli", "flate2", "lz4", "zstd"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic         = "abort"
codegen-units = 1
lto           = true
opt-level     = "s"
strip         = true
