name: Release

# Triggers on version tags (v1.0.0, v0.2.1, etc.)
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Publish as draft release'
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build — ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:

          # ── macOS universal (Apple Silicon + Intel in one binary) ──────────
          - name: macOS Universal
            runner: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri-args: --target universal-apple-darwin

          # ── Windows x64 ────────────────────────────────────────────────────
          - name: Windows x64
            runner: windows-latest
            rust-targets: ''
            tauri-args: --target x86_64-pc-windows-msvc --bundles msi

          # ── Linux x64 (AppImage + .deb) ────────────────────────────────────
          - name: Linux x64
            runner: ubuntu-22.04
            rust-targets: ''
            tauri-args: --target x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Node ────────────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ── Rust ────────────────────────────────────────────────────────────────
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      # ── Linux system deps ───────────────────────────────────────────────────
      - name: Install Linux system dependencies
        if: matrix.runner == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # ── Frontend ────────────────────────────────────────────────────────────
      - name: Install frontend dependencies
        run: npm install

      # ── Tauri build + GitHub release ────────────────────────────────────────
      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Rex's Parquets ${{ github.ref_name }}
          releaseBody: |
            ## Rex's Parquets ${{ github.ref_name }}

            ### Downloads
            | Platform | Installer |
            |---|---|
            | **macOS** (Apple Silicon + Intel) | `Rex's.Parquets_*.dmg` |
            | **Windows** x64 | `Rex's.Parquets_*_x64_en-US.msi` |
            | **Linux** x64 | `rexs-parquets_*_amd64.AppImage` · `rexs-parquets_*_amd64.deb` |

            > **macOS note:** The app is not notarized. On first launch right-click → Open
            > to bypass Gatekeeper, or run:
            > `xattr -dr com.apple.quarantine "/Applications/Rex's Parquets.app"`
          releaseDraft: ${{ github.event.inputs.draft != 'false' }}
          prerelease: false
          tauriScript: npx tauri
          args: ${{ matrix.tauri-args }}
